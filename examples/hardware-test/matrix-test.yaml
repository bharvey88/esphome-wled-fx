# A 16x16 serpentine WS2812 matrix through the light front end.
#
# The same tour harness again, on the other geometry the light front end
# supports: one strip of 256 pixels described to the engine as a 16 by 16
# canvas. This is where a 2D effect on the light path gets checked, and where a
# wiring or serpentine mistake shows up immediately (Scrolling Text and Matrix
# are the two effects that make it obvious).
#
# No secrets.yaml is needed to build or flash this. See network.yaml.

substitutions:
  # Which tour group this firmware starts on. tour.yaml lists them; on a
  # panel "Panel" is the effects a 2D output offers without the 1D opt-in.
  tour_default_group: Panel
  led_pin: GPIO16
  matrix_width: "16"
  matrix_height: "16"
  # width times height.
  led_count: "256"

  # The access point this board offers when it has no network to join. Distinct
  # per config so two boards can be on the bench at once.
  ap_ssid: WLED FX matrix test

esphome:
  name: wled-fx-matrix-test
  friendly_name: WLED FX matrix test
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: matrix_strip
            brightness: 60%
            effect: WLED FX

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # The console is the plain ESP32 default, UART0, which is the USB to serial
  # bridge on a devkit and is what improv_serial in network.yaml talks over.

external_components:
  - source:
      type: local
      path: ../../components

packages:
  # wifi, the fallback access point, the captive portal, Improv over serial,
  # the API, OTA and the web server. No secrets file involved.
  network: !include network.yaml
  tour: !include tour.yaml

wled_fx:

light:
  - platform: esp32_rmt_led_strip
    id: matrix_strip
    name: Matrix
    pin: ${led_pin}
    num_leds: ${led_count}
    rgb_order: GRB
    chipset: WS2812
    # ESPHome's light default is 2.8, WLED's output gamma is 2.2. This is the
    # closest an ESPHome light gets to what a WLED strip emits. It is not
    # identical: ESPHome gamma-corrects after its own brightness scaling and
    # WLED corrects first, so a dimmed strip is darker here than on WLED. See
    # PORTING.md deviation 33.
    gamma_correct: 2.2
    effects:
      - wled_fx:
          id: fx
          name: WLED FX
          # Turn the one strip into a canvas. `serpentine: true` matches the
          # usual boustrophedon wiring; set it to false for a progressive panel
          # and every other row will stop being mirrored.
          width: ${matrix_width}
          height: ${matrix_height}
          serpentine: true
          # Width and height make this a 2D output, which offers only the
          # 2D-capable effects. The tour has to reach all 223, so ask for the
          # 1D ones back; they run through WLED's 1D to 2D mapping.
          include_1d_effects: true
          update_interval: 23ms
          # Colour 1 comes from the "Color 1" entity the harness adds, the
          # same as it does on the panel builds, rather than from this
          # light's own colour. Leave it true and the engine is handed the
          # light colour again on every frame, so the colour slot could
          # never be set to anything else.
          use_light_color: false
