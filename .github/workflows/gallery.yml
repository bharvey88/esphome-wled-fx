name: Effect gallery

# Builds docs/gallery from the simulator and publishes it to GitHub Pages.
#
# Pushes only trigger it on main, and only when something that changes what a
# preview looks like changes, because a full run renders 223 effects and encodes
# 446 WebP files. A manual run on any branch builds the gallery and uploads it as
# an ordinary artifact; only main ever deploys, so running this from a topic
# branch cannot fail on a Pages permission it does not have.
#
# Deploying also waits on the repository variable GALLERY_PAGES being "true".
# Pages is not switched on yet, and actions/deploy-pages fails rather than
# skipping when it is off, which would turn every push to main red for a page
# nobody is serving. The two Pages jobs are skipped until the variable is set,
# and the build still runs and still uploads the plain artifact, so a broken
# gallery is still caught. docs/gallery/README.md has the order to do it in.

on:
  push:
    branches: [main]
    paths:
      - "components/wled_fx/**"
      - "tools/sim/**"
      - "tools/gallery/**"
      - "docs/gallery/**"
      - ".github/workflows/gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render the previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the gallery
        run: python tools/gallery/build_gallery.py

      # A manual run on a branch is how the previews get regenerated without a
      # machine that can build the simulator locally.
      - name: Upload the gallery as a plain artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: docs/gallery
          retention-days: 7

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && vars.GALLERY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/gallery

  deploy:
    name: Publish to Pages
    needs: build
    # Only main deploys, and only once Pages is switched on for the repository:
    # docs/gallery/README.md has the settings the owner has to change and the
    # variable that turns this job on.
    if: github.ref == 'refs/heads/main' && vars.GALLERY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
