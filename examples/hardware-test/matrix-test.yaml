# A 16x16 serpentine WS2812 matrix through the light front end.
#
# The same tour harness again, on the other geometry the light front end
# supports: one strip of 256 pixels described to the engine as a 16 by 16
# canvas. This is where a 2D effect on the light path gets checked, and where a
# wiring or serpentine mistake shows up immediately (Scrolling Text and Matrix
# are the two effects that make it obvious).
#
# No secrets.yaml is needed to build or flash this. See network.yaml.

substitutions:
  led_pin: GPIO16
  matrix_width: "16"
  matrix_height: "16"
  # width times height.
  led_count: "256"

  # The access point this board offers when it has no network to join. Distinct
  # per config so two boards can be on the bench at once.
  ap_ssid: WLED FX matrix test

esphome:
  name: wled-fx-matrix-test
  friendly_name: WLED FX matrix test
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: matrix_strip
            brightness: 60%
            effect: WLED FX

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # The console is the plain ESP32 default, UART0, which is the USB to serial
  # bridge on a devkit and is what improv_serial in network.yaml talks over.

external_components:
  - source:
      type: local
      path: ../../components

packages:
  # wifi, the fallback access point, the captive portal, Improv over serial,
  # the API, OTA and the web server. No secrets file involved.
  network: !include network.yaml
  tour: !include tour.yaml

wled_fx:

light:
  - platform: esp32_rmt_led_strip
    id: matrix_strip
    name: Matrix
    pin: ${led_pin}
    num_leds: ${led_count}
    rgb_order: GRB
    chipset: WS2812
    effects:
      - wled_fx:
          id: fx
          name: WLED FX
          # Turn the one strip into a canvas. `serpentine: true` matches the
          # usual boustrophedon wiring; set it to false for a progressive panel
          # and every other row will stop being mirrored.
          width: ${matrix_width}
          height: ${matrix_height}
          serpentine: true
          update_interval: 23ms
