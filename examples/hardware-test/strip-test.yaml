# Plain addressable strip on a plain ESP32: the same tour harness through the
# light front end instead of the display front end.
#
# This is the cheapest way to answer section 1 of HARDWARE-CHECKLIST.md, the
# pacing and driver questions that need nothing but a strip.

substitutions:
  # Set these two to your wiring. Everything else is the same harness the panel
  # builds use.
  led_pin: GPIO16
  led_count: "60"

esphome:
  name: wled-fx-strip-test
  friendly_name: WLED FX strip test
  on_boot:
    # The light front end only renders while the light is on and the WLED FX
    # effect is selected, so the harness would look dead without this.
    - priority: -100
      then:
        - light.turn_on:
            id: strip
            brightness: 60%
            effect: WLED FX

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 3

external_components:
  - source:
      type: local
      path: ../../components

packages:
  tour: !include tour.yaml

# A bare wled_fx block is what puts the light effect into the effect registry.
wled_fx:

light:
  - platform: esp32_rmt_led_strip
    id: strip
    # Brightness lives on this entity. The web server shows it as a slider on
    # the light itself, so the harness does not add a second one.
    name: Strip
    pin: ${led_pin}
    num_leds: ${led_count}
    rgb_order: GRB
    chipset: WS2812
    effects:
      - wled_fx:
          # `id: fx` is the contract the tour package expects.
          id: fx
          name: WLED FX
          update_interval: 23ms
