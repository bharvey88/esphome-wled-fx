# Plain addressable strip on a plain ESP32: the same tour harness through the
# light front end instead of the display front end.
#
# This is the cheapest way to answer section 1 of HARDWARE-CHECKLIST.md, the
# pacing and driver questions that need nothing but a strip.
#
# No secrets.yaml is needed to build or flash this. See network.yaml.

substitutions:
  # Which tour group this firmware starts on. tour.yaml lists them; on a
  # panel "Panel" is the effects a 2D output offers without the 1D opt-in.
  tour_default_group: Strip
  # Set these two to your wiring. Everything else is the same harness the panel
  # builds use.
  led_pin: GPIO16
  led_count: "60"

  # The access point this board offers when it has no network to join. Distinct
  # per config so two boards can be on the bench at once.
  ap_ssid: WLED FX strip test

esphome:
  name: wled-fx-strip-test
  friendly_name: WLED FX strip test
  on_boot:
    # The light front end only renders while the light is on and the WLED FX
    # effect is selected, so the harness would look dead without this.
    - priority: -100
      then:
        - light.turn_on:
            id: strip
            brightness: 60%
            effect: WLED FX

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # The console is the plain ESP32 default, UART0, which is the USB to serial
  # bridge on a devkit and is what improv_serial in network.yaml talks over.

external_components:
  - source:
      type: local
      path: ../../components

packages:
  # wifi, the fallback access point, the captive portal, Improv over serial,
  # the API, OTA and the web server. No secrets file involved.
  network: !include network.yaml
  tour: !include tour.yaml

# A bare wled_fx block is what puts the light effect into the effect registry.
wled_fx:

light:
  - platform: esp32_rmt_led_strip
    id: strip
    # Brightness lives on this entity, so the harness adds no slider of its
    # own. It is not the only one: tour.yaml's Colour 1 light is the engine's
    # master, so its brightness multiplies this one and turning it off blanks
    # the strip while this entity is still on. Dim with this one.
    name: Strip
    pin: ${led_pin}
    num_leds: ${led_count}
    rgb_order: GRB
    chipset: WS2812
    # ESPHome's light default is 2.8, WLED's output gamma is 2.2. This is the
    # closest an ESPHome light gets to what a WLED strip emits. It is not
    # identical: ESPHome gamma-corrects after its own brightness scaling and
    # WLED corrects first, so a dimmed strip is darker here than on WLED. See
    # PORTING.md deviation 33.
    gamma_correct: 2.2
    effects:
      - wled_fx:
          # `id: fx` is the contract the tour package expects.
          id: fx
          name: WLED FX
          update_interval: 23ms
          # Colour 1 comes from the "Color 1" entity the harness adds, the
          # same as it does on the panel builds, rather than from this
          # light's own colour. Leave it true and the engine is handed the
          # light colour again on every frame, so the colour slot could
          # never be set to anything else.
          use_light_color: false
