name: CI

on:
  push:
    branches: [main]
    # Contact sheets are only rendered on a tag or a manual run, so a tag has to
    # be able to start a run for that to mean anything.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-sim:
    name: Host simulator
    runs-on: ubuntu-latest
    env:
      # Contact sheets are about 726 MB per run: 223 effects x 6 geometries x 2
      # control passes, and the 64 row geometries dominate. They are worth having
      # when somebody is going to look at them and worth nothing on every routine
      # push, so they are only rendered on a manual run or a tag, and they expire
      # in days rather than the default 90. Skipping them also takes a few
      # minutes off the ordinary run.
      WANT_IMAGES: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S tools/sim -B tools/sim/build -G Ninja -DWLED_FX_SANITIZE=ON

      - name: Build
        run: cmake --build tools/sim/build

      - name: List registered effects and their parsed defaults
        run: tools/sim/build/wled_fx_sim --list

      - name: Run every effect at every default geometry
        run: |
          mkdir -p tools/sim/out
          if [ "$WANT_IMAGES" = "true" ]; then
            tools/sim/build/wled_fx_sim --out tools/sim/out
          else
            tools/sim/build/wled_fx_sim --no-images --out tools/sim/out
          fi

      # The small end of the geometries the defaults do not cover. Division by a
      # length that turned out to be zero only happens here, and these sizes cost
      # almost nothing to run because a frame is one to three pixels. The large
      # end, 128x64, 256x64 and 1000x1, is in the job below, because those are
      # too slow to put in front of the sanitizers.
      - name: Run every effect at the smallest geometries
        run: |
          for size in 1x1 1x2 2x1 3x1; do
            tools/sim/build/wled_fx_sim --size "$size" --no-images --out tools/sim/out
          done

      # --single-pass, so this is five runs of every effect rather than ten. The
      # mapping sweep is looking for out-of-bounds writes under a mapping the
      # metadata never selects, and the checks pass in the step above already
      # covers the checkmark code at every geometry. Running both here multiplied
      # this job's time by about five under the sanitizers for very little extra
      # reach. Run it without --single-pass before a release.
      - name: Run every effect through every 1D to 2D mapping mode
        run: |
          for map in 0 1 2 3 4; do
            tools/sim/build/wled_fx_sim --map "$map" --single-pass --no-images --out tools/sim/out
          done

      - name: Audio pipeline test
        run: tools/sim/build/wled_fx_audio_test

      - name: Effect and control behaviour tests
        run: tools/sim/build/wled_fx_effect_test

      - name: README effect list is generated from the registry, not hand typed
        run: python3 tools/gen_readme_effects.py --check

      - name: Effect and palette names the config validation sees match the registry
        run: python3 tools/check_effect_names.py

      - name: Upload contact sheets
        uses: actions/upload-artifact@v4
        if: always() && env.WANT_IMAGES == 'true'
        with:
          name: contact-sheets
          path: tools/sim/out/*.png
          retention-days: 5

  # A 256x64 frame is 16384 pixels, sixteen times a 64x64 one, and the particle
  # and blur effects scale with it. Under the sanitizers that is hours, so this
  # runs the same binary without them, in parallel, and relies on the canvas
  # guard bands rather than ASan to catch a write past the end. Between the two
  # jobs every effect still sees every size.
  large-geometries:
    name: Host simulator, large geometries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S tools/sim -B tools/sim/build -G Ninja

      - name: Build
        run: cmake --build tools/sim/build

      # 128x64 and 256x64 are the panel sizes where an index held in 8 or 16 bits
      # runs out of room. 1000x1 is the same question for a long strip.
      - name: Run every effect at 128x64, 256x64 and 1000x1
        run: |
          for size in 128x64 256x64 1000x1; do
            tools/sim/build/wled_fx_sim --size "$size" --no-images --out /tmp/wled_fx_out
          done

  compile:
    name: esphome compile ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - strip-esp32.yaml
          - strip-esp32-arduino.yaml
          - m1-hub75.yaml
          - m1-hub75-audio.yaml
          - host.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create the fake secrets the examples reference
        run: cp examples/secrets.yaml.example examples/secrets.yaml

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
            examples/.esphome
          key: esphome-${{ matrix.config }}-${{ hashFiles('examples/*.yaml') }}
          restore-keys: esphome-${{ matrix.config }}-

      - name: Compile
        run: esphome compile examples/${{ matrix.config }}
