# The shared hardware-test harness: tour mode, the runtime controls and the
# diagnostic sensors. Included as a package by every config in this folder.
#
# Two things a config has to provide before including this:
#
#   1. a wled_fx controller with `id: fx`, either a display front end or the
#      `wled_fx` effect on a light;
#   2. `esphome: includes: [hwtest.h]`, which is where the group lookup and the
#      checklist live.
#
# Everything here works over the web server with no Home Assistant attached.

esphome:
  includes:
    # Resolved against the directory of the config being built, which is this
    # one as long as the config including this package sits beside it.
    - hwtest.h
  on_boot:
    # After every setup(), so the engine exists and the entities are alive to
    # publish into. delta 0 publishes the starting effect without changing it.
    - priority: -100
      then:
        - script.execute:
            id: tour_goto
            delta: 0
            to: -1

globals:
  # Index into the "Tour group" select's options. See Filter in hwtest.h.
  - id: tour_filter
    type: int
    restore_value: false
    initial_value: "0"
  # millis() at which the tour advances next.
  - id: tour_next_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # True between "Profile run" and the RESULT line of the last effect.
  - id: tour_profile
    type: bool
    restore_value: false
    initial_value: "false"
  # Where the profile run has got to in the filtered list, so that coming back
  # to the start is what ends it.
  - id: tour_profile_last
    type: int
    restore_value: false
    initial_value: "0"

script:
  # delta 1 steps forward, -1 steps back, 0 stays put and only re-publishes.
  # `to` 0 or more jumps straight to that registry index instead, and does not
  # log a result for the effect it leaves, which is how a profile run starts
  # without an entry for whatever happened to be on screen.
  #
  # Everything that changes the effect goes through here, so there is exactly
  # one place that logs the change and one place that resets the dwell timer.
  - id: tour_goto
    mode: single
    parameters:
      delta: int
      to: int
    then:
      - lambda: |-
          auto *ctrl = id(fx);
          const int filter = id(tour_filter);
          const size_t current = ctrl->engine().effect_index();

          // One machine readable line for the effect being left, with the
          // timings it collected while it was on screen.
          if (delta != 0 && to < 0) {
            ESP_LOGI("tour", "%s",
                     wledfx_hwtest::result_line(
                         ctrl, current,
                         (unsigned) wledfx_hwtest::position(ctrl, filter, current)).c_str());
          }

          // A group can be empty on this output: "2D" on a strip, or "1D" on a
          // matrix that did not opt in to the 1D effects. Say so once rather
          // than log "1/0" and leave somebody wondering why nothing moved.
          if (wledfx_hwtest::count(ctrl, filter) == 0) {
            ESP_LOGW("tour", "[tour] this group has no effect that runs on a %s output",
                     ctrl->layout_2d() ? "2D" : "1D");
            return;
          }

          size_t index;
          if (to >= 0) {
            index = wledfx_hwtest::first(ctrl, filter, (size_t) to);
          } else if (delta == 0) {
            index = wledfx_hwtest::first(ctrl, filter, current);
          } else {
            index = wledfx_hwtest::step(ctrl, filter, current, delta);
          }
          ctrl->engine().set_effect_index(index);
          // The engine was moved behind the platforms' backs, so ask the
          // select, number and switch entities to republish. They follow the
          // engine, so Effect and Palette track the tour from here on.
          ctrl->notify_state_change();

          const std::string name = ctrl->current_effect_name();
          // A 1D effect on a panel reaches it through WLED's own 1D to 2D
          // mapping and looks like a short line crawling along a long strip,
          // which is right and surprising. Say which ones those are.
          const std::string group =
              std::string(wledfx_hwtest::group_of(index)) +
              (wledfx_hwtest::strip_only_on_panel(ctrl, index) ? " (strip effect, mapped)" : "");
          const unsigned position = (unsigned) wledfx_hwtest::position(ctrl, filter, index);
          ESP_LOGI("tour", "[tour] %u/%u \"%s\" group=%s",
                   position, (unsigned) wledfx_hwtest::count(ctrl, filter), name.c_str(), group.c_str());
          id(tour_effect).publish_state(name);
          id(tour_group).publish_state(group);

          // A profile run is over when the tour comes back round to where it
          // started, which is the first position the filter accepts.
          if (id(tour_profile) && to < 0 && position <= (unsigned) id(tour_profile_last)) {
            ESP_LOGI("tour", "[tour] PROFILE DONE");
            id(tour_profile) = false;
            id(tour_auto).turn_off();
          }
          id(tour_profile_last) = (int) position;

          // Two effects are paced so slowly that a short dwell never reaches
          // anything worth looking at. See PACED in hwtest.h.
          const uint32_t dwell_ms = (uint32_t) (id(tour_dwell).state * 1000.0f)
                                    * wledfx_hwtest::dwell_multiplier(index);
          id(tour_next_ms) = millis() + dwell_ms;

interval:
  # 200 ms is fine grained enough for a one second dwell and costs nothing.
  - interval: 200ms
    then:
      - if:
          condition:
            - switch.is_on: tour_auto
            # Signed, so the comparison survives the millis() wrap.
            - lambda: "return (int32_t) (millis() - id(tour_next_ms)) >= 0;"
          then:
            - script.execute:
                id: tour_goto
                delta: 1
                to: -1

switch:
  # Off pauses the tour and leaves the current effect on screen.
  - platform: template
    id: tour_auto
    name: Tour auto advance
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: mdi:play-pause
    on_turn_on:
      - lambda: "id(tour_next_ms) = millis() + (uint32_t) (id(tour_dwell).state * 1000.0f);"

  # Off, the default, means a control belongs to the effect you set it on: the
  # next effect refills every control from its own WLED defaults. On is the
  # component's own behaviour, where a control you move follows you into every
  # effect after it. That is useful when you are comparing one setting across
  # effects and baffling when you have forgotten you did it, which is why it is
  # a switch you can see rather than something implied.
  #
  # Turning this off does not unpin what is already pinned, including anything
  # the YAML set. "Unpin controls" does that.
  - platform: template
    id: tour_pin
    name: Pin controls
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: mdi:pin
    entity_category: config
    on_turn_on:
      - lambda: "id(fx)->engine().set_sticky_controls(true);"
    on_turn_off:
      - lambda: "id(fx)->engine().set_sticky_controls(false);"

  - platform: wled_fx
    wled_fx_id: fx
    type: check1
    name: Check 1
  - platform: wled_fx
    wled_fx_id: fx
    type: check2
    name: Check 2
  - platform: wled_fx
    wled_fx_id: fx
    type: check3
    name: Check 3

number:
  - platform: template
    id: tour_dwell
    name: Tour dwell
    unit_of_measurement: s
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: false
    mode: box

  - platform: wled_fx
    wled_fx_id: fx
    type: speed
    name: Speed
  - platform: wled_fx
    wled_fx_id: fx
    type: intensity
    name: Intensity
  - platform: wled_fx
    wled_fx_id: fx
    type: custom1
    name: Custom 1
  - platform: wled_fx
    wled_fx_id: fx
    type: custom2
    name: Custom 2
  # custom3 is a five bit control in WLED, 0 to 31, and the effects divide it
  # down as one. The platform gives it that range; a 0 to 255 slider here would
  # silently rotate Scrolling Text and re-tune a dozen other effects.
  - platform: wled_fx
    wled_fx_id: fx
    type: custom3
    name: Custom 3

# The three WLED colour slots. Which of them the running effect uses, and what
# it calls them, is on the "Effect colours" sensor below. Colour 1 is also the
# panel master: its brightness dims the whole frame and turning it off blanks
# the panel, as WLED's own power button does.
light:
  - platform: wled_fx
    wled_fx_id: fx
    type: color1
    name: Color 1
  - platform: wled_fx
    wled_fx_id: fx
    type: color2
    name: Color 2
  - platform: wled_fx
    wled_fx_id: fx
    type: color3
    name: Color 3

select:
  # Narrows the tour to one part of the port. "Checklist" is the effects
  # HARDWARE-CHECKLIST.md asks about, in registry order.
  - platform: template
    id: tour_group_filter
    name: Tour group
    optimistic: true
    # "Panel" on the two matrix configs and "Strip" on the strip, so the tour
    # starts on the effects that output actually shows well. See
    # docs/HARDWARE-TESTING.md.
    initial_option: ${tour_default_group}
    restore_value: false
    options:
      - All
      - Panel
      - Strip
      - 1D
      - 2D
      - Particle 2D
      - Particle 1D
      - Audio
      - MM
      - Checklist
    on_value:
      - lambda: "id(tour_filter) = (int) i;"
      # delta 0 keeps the current effect when the new filter accepts it and
      # jumps to the first one that fits when it does not.
      - script.execute:
          id: tour_goto
          delta: 0
          to: -1

  - platform: wled_fx
    wled_fx_id: fx
    type: effect
    name: Effect
  - platform: wled_fx
    wled_fx_id: fx
    type: palette
    name: Palette

button:
  - platform: template
    name: Next effect
    icon: mdi:skip-next
    on_press:
      - script.execute:
          id: tour_goto
          delta: 1
          to: -1

  - platform: template
    name: Previous effect
    icon: mdi:skip-previous
    on_press:
      - script.execute:
          id: tour_goto
          delta: -1
          to: -1

  # The engine's own restart: the segment goes back to frame zero and the
  # scratch block is marked stale so the effect reinitialises into it. No
  # control changes, so nothing has to republish.
  - platform: template
    name: Restart effect
    icon: mdi:restart
    on_press:
      - lambda: "id(fx)->engine().restart_effect();"

  # Puts every control back on the effect's own metadata defaults, including
  # anything the YAML pinned and anything pinned while "Pin controls" was on.
  # Clearing the pins is not enough on its own: the defaults are refilled on an
  # effect change, so this reselects the current index.
  - platform: template
    name: Unpin controls
    icon: mdi:pin-off
    on_press:
      - lambda: |-
          auto *ctrl = id(fx);
          ctrl->engine().clear_override(0xFFFF);
          ctrl->engine().set_effect_index(ctrl->engine().effect_index());
          ctrl->notify_state_change();

  # One unattended pass over every effect at a five second dwell, logging one
  # RESULT line per effect. tools/parse_profile_log.py turns the captured log
  # into a table. docs/HARDWARE-TESTING.md has the commands.
  - platform: template
    name: Profile run
    icon: mdi:timer-play
    on_press:
      - number.set:
          id: tour_dwell
          value: 5
      - select.set:
          id: tour_group_filter
          option: All
      - lambda: |-
          auto *ctrl = id(fx);
          // Start from a clean slate: anything pinned earlier would profile a
          // setting nobody will be running.
          ctrl->engine().clear_override(0xFFFF);
          id(tour_profile) = true;
          id(tour_profile_last) = 0;
          ESP_LOGI("tour", "[tour] PROFILE START effects=%u dwell=5s",
                   (unsigned) wledfx_hwtest::count(ctrl, id(tour_filter)));
      - script.execute:
          id: tour_goto
          delta: 0
          to: 0
      - switch.turn_on: tour_auto

text_sensor:
  - platform: template
    id: tour_effect
    name: Effect name
    update_interval: never
  - platform: template
    id: tour_group
    name: Effect group
    update_interval: never

  # What the generic Speed, Intensity, Custom and Check entities above actually
  # do in the effect that is running, in WLED's own words, read out of the
  # effect's metadata. Controls the effect does not use are left out.
  - platform: wled_fx
    wled_fx_id: fx
    type: controls
    name: Effect controls
  - platform: wled_fx
    wled_fx_id: fx
    type: colors
    name: Effect colours

debug:
  update_interval: 10s

sensor:
  # Frames the engine actually rendered, not the interval it was asked for.
  # Segment::call counts one per rendered frame, and the frame gate accumulates
  # its deadline rather than re-arming it, so at the default 23 ms interval this
  # should settle near 43 on both front ends. A number near 31 used to be the
  # scheduler re-arming the interval; that is fixed, so 31 now means the effect
  # really is taking two main loop ticks per frame.
  #
  # Segment::call restarts at zero on every effect change, including the tour's,
  # so a window that straddles one has no honest frame count. Those windows
  # publish nothing rather than a number that is low for the wrong reason.
  - platform: template
    id: fx_fps
    name: Effect frame rate
    unit_of_measurement: fps
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 2s
    lambda: |-
      static uint32_t last_call = 0;
      static uint32_t last_ms = 0;
      const uint32_t call = id(fx)->engine().segment().call;
      const uint32_t now = millis();
      const uint32_t frames = call - last_call;
      const uint32_t elapsed = now - last_ms;
      const bool straddled = call < last_call;
      const bool first = last_ms == 0;
      last_call = call;
      last_ms = now;
      if (first || straddled || elapsed == 0)
        return {};
      return 1000.0f * frames / elapsed;

  # The two halves of a frame. Render time is the effect function, output time
  # is the canvas to the panel, both averaged over the time the current effect
  # has been up, with its first second left out.
  - platform: wled_fx
    wled_fx_id: fx
    type: render_time
    name: Effect render time
  - platform: wled_fx
    wled_fx_id: fx
    type: output_time
    name: Frame output time

  # Segment::data_size() is the scratch block the running effect asked for. For
  # the 31 particle effects that is the particle system allocation: the particle
  # array, the flags, the sources and the collision bins.
  - platform: template
    name: Effect data bytes
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: "return (float) id(fx)->engine().segment().data_size();"

  - platform: template
    name: PSRAM free
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: "return (float) wledfx_hwtest::psram_free();"

  - platform: debug
    free:
      name: Heap free
    block:
      name: Heap largest free block
    fragmentation:
      name: Heap fragmentation
    loop_time:
      name: Loop time
