# Apollo M-1 (ESP32-S3, 64x64 HUB75 panel): the hardware review firmware.
#
# Flash this first. It carries all 223 effects, the tour harness, every runtime
# control and the diagnostic sensors, and it needs nothing but a browser on the
# same network. docs/HARDWARE-TESTING.md is the session guide.
#
# No secrets.yaml is needed to build or flash this. network.yaml brings up a
# fallback access point and a captive portal, so the board gets your wifi
# credentials after it is flashed rather than before it is built.
#
# The engine owns the frame clock, so the display is handed over with
# `update_interval: never` and `auto_clear_enabled: false`.

substitutions:
  # Which tour group this firmware starts on. tour.yaml lists them; on a
  # panel "Panel" is the effects a 2D output offers without the 1D opt-in.
  tour_default_group: Panel
  # Which effects the "Effect" dropdown lists, by the same rule. The 1D-only
  # ones this build also carries are on the separate "Strip effect (mapped)"
  # dropdown that panel-effects.yaml adds.
  tour_effect_scope: panel
  # The access point this board offers when it has no network to join. Distinct
  # per config so two boards can be on the bench at once.
  ap_ssid: WLED FX M-1 test

esphome:
  name: wled-fx-m1-test
  friendly_name: WLED FX M-1 test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  # DEBUG is what prints the sensor states and, on the audio build, the one-off
  # analysis cost line.
  level: DEBUG
  # The console is left on the S3 default, USB_SERIAL_JTAG, which is the native
  # USB port and is what improv_serial in network.yaml talks over. If this
  # board turns out to log through a USB to UART bridge instead, add
  # `hardware_uart: UART0` here; improv_serial works on that too.

external_components:
  - source:
      type: local
      path: ../../components

packages:
  # wifi, the fallback access point, the captive portal, Improv over serial,
  # the API, OTA and the web server. No secrets file involved.
  network: !include network.yaml
  tour: !include tour.yaml
  # The second effect dropdown, for the effects this panel maps from 1D.
  panel_effects: !include panel-effects.yaml

display:
  - platform: hub75
    id: matrix
    # ONE LINE SWITCH FOR A REV4 PANEL: replace the line below with
    #   board: apollo-automation-m1-rev4
    board: apollo-automation-m1-rev6
    panel_width: 64
    panel_height: 64
    update_interval: never
    auto_clear_enabled: false
    double_buffer: true
    # WLED's HUB75 builds compile the panel library with -D NO_CIE1931, so the
    # only curve on a WLED panel is the gamma 2.2 that show() applies. This
    # driver applies CIE1931 unless it is told not to, and two curves in a row
    # is a much darker panel than a WLED device. wled_fx does the gamma, the
    # driver stays out of the way.
    gamma_correct: LINEAR

wled_fx:
  id: fx
  display_id: matrix
  update_interval: 23ms
  # WLED applies gamma 2.2 to the finished frame in show(), and so does this.
  # It is the default; 1.0 turns the stage off for a display that already
  # applies a curve of its own.
  gamma_correct: 2.2
  # The point of this firmware is to walk every effect on real hardware, and a
  # display offers only the 2D-capable ones unless it is asked for the rest.
  # A build for a panel you actually want to look at should leave this out and
  # save the flash; see examples/m1-hub75.yaml.
  include_1d_effects: true
  effect: Fire 2012
  text: "WLED FX"

number:
  - platform: template
    id: panel_brightness
    # The panel's hardware duty, which is the one to dim with: it shortens the
    # drive time rather than scaling the frame, so it keeps shadow detail that
    # scaling an 8 bit frame throws away. Colour 1's brightness is the other
    # one, and it does scale the frame.
    #
    # 220, not the hub75 driver's own default of 128. The reference WLED unit
    # this port is compared against runs at 220, and a side by side at 128
    # against 220 says nothing about the engine and everything about the duty
    # cycle: the port simply looks dim. Start where the thing being compared
    # against starts. See PORTING.md deviation 36.
    name: Panel brightness
    min_value: 1
    max_value: 255
    step: 1
    initial_value: 220
    optimistic: true
    restore_value: false
    mode: slider
    on_value:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda "return (uint8_t) x;"

# There is no physical button here on purpose. The hub75 board preset
# `apollo-automation-m1-rev6` defines the fourteen panel pins and nothing else,
# and no Apollo M-1 pin map in refs/esphome names a boot or user button, so the
# GPIO would be a guess. If you know the pin, this is the block:
#
# binary_sensor:
#   - platform: gpio
#     pin:
#       number: GPIO0        # <- the real button pin, not a guess
#       mode:
#         input: true
#         pullup: true
#       inverted: true
#     id: boot_button
#     on_click:
#       - min_length: 50ms
#         max_length: 600ms
#         then:
#           - script.execute: {id: tour_goto, delta: 1}
#       - min_length: 700ms
#         max_length: 3000ms
#         then:
#           - switch.toggle: tour_auto
